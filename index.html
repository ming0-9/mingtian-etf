<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行业板块交易所走势图系统</title>
  <!-- 引入 KLineChart 金融图表库 -->
  <script src="https://cdn.jsdelivr.net/npm/klinecharts/dist/klinecharts.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121418;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部导航通栏 */
    .app-header {
      height: 50px;
      background-color: #1a1d24;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 16px;
      font-weight: 600;
      color: #f0f3fa;
    }

    /* 主体左右布局 */
    .exchange-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 左侧行业板块列表 */
    .industry-sidebar {
      width: 240px;
      background-color: #1a1d24;
      border-right: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
    }
    .sidebar-title {
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #848e9c;
      border-bottom: 1px solid #2a2e39;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #industry-menu {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }
    .industry-item {
      padding: 12px 16px;
      font-size: 13px;
      color: #b7bdc6;
      cursor: pointer;
      border-bottom: 1px solid rgba(42, 46, 57, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .industry-item:hover {
      background-color: #2b313a;
      color: #f0f3fa;
    }
    .industry-item.active {
      background-color: #2b313a;
      color: #2962ff;
      border-left: 3px solid #2962ff;
      font-weight: 500;
    }
    .item-code {
      font-size: 11px;
      color: #5d6673;
    }
    .industry-item.active .item-code {
      color: #7b9eff;
    }

    /* 右侧图表面板 */
    .chart-main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #121418;
    }

    /* 图表上方控制栏 */
    .chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background-color: #1a1d24;
      border-bottom: 1px solid #2a2e39;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stock-title {
      font-size: 16px;
      font-weight: 600;
      color: #f0f3fa;
    }
    .stock-tag {
      font-size: 11px;
      background: #2b313a;
      color: #2962ff;
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .group-label {
      font-size: 12px;
      color: #848e9c;
    }
    .btn {
      background-color: #2b313a;
      color: #b7bdc6;
      border: 1px solid transparent;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn:hover {
      background-color: #363c4e;
      color: #f0f3fa;
    }
    .btn.active {
      background-color: #2962ff;
      color: #ffffff;
      font-weight: 500;
    }

    /* K线图容器 */
    #chart-container {
      flex: 1;
      width: 100%;
    }

    /* 错误提示 */
    .error-tip {
      display: none;
      color: #f23645;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- 顶部标题栏 -->
  <header class="app-header">
    行业板块行情与技术分析系统
  </header>

  <!-- 主体容器 -->
  <div class="exchange-container">
    
    <!-- 左侧行业板块菜单 -->
    <div class="industry-sidebar">
      <div class="sidebar-title">行业板块列表</div>
      <ul id="industry-menu">
        <li class="industry-item active" data-code="880491" data-name="半导体板块" data-base="1500" data-vol="0.04">
          <span>半导体</span><span class="item-code">880491</span>
        </li>
        <li class="industry-item" data-code="880406" data-name="医药医疗板块" data-base="3200" data-vol="0.025">
          <span>医药医疗</span><span class="item-code">880406</span>
        </li>
        <li class="industry-item" data-code="880471" data-name="新能源车板块" data-base="2200" data-vol="0.05">
          <span>新能源车</span><span class="item-code">880471</span>
        </li>
        <li class="industry-item" data-code="880435" data-name="人工智能板块" data-base="1800" data-vol="0.065">
          <span>人工智能</span><span class="item-code">880435</span>
        </li>
        <li class="industry-item" data-code="880447" data-name="券商概念板块" data-base="1100" data-vol="0.035">
          <span>券商概念</span><span class="item-code">880447</span>
        </li>
        <li class="industry-item" data-code="880455" data-name="军工装备板块" data-base="1350" data-vol="0.045">
          <span>军工装备</span><span class="item-code">880455</span>
        </li>
      </ul>
    </div>

    <!-- 右侧图表主区域 -->
    <div class="chart-main-panel">
      <!-- 控制栏：主副图指标切换 -->
      <div class="chart-toolbar">
        <div class="title-area">
          <span id="current-stock-title" class="stock-title">半导体板块 (880491)</span>
          <span class="stock-tag">行业指数</span>
        </div>

        <div class="controls-wrapper">
          <!-- 主图指标切换 -->
          <div class="btn-group">
            <span class="group-label">主图:</span>
            <button class="btn active" id="btn-boll" onclick="switchMainIndicator('BOLL')">BOLL</button>
            <button class="btn" id="btn-ma" onclick="switchMainIndicator('MA')">MA</button>
            <button class="btn" id="btn-none" onclick="switchMainIndicator('NONE')">无</button>
          </div>

          <!-- 副图指标开关 -->
          <div class="btn-group">
            <span class="group-label">副图:</span>
            <button class="btn active" id="btn-vol" onclick="toggleSubIndicator('VOL')">VOL</button>
            <button class="btn active" id="btn-macd" onclick="toggleSubIndicator('MACD')">MACD</button>
            <button class="btn" id="btn-rsi" onclick="toggleSubIndicator('RSI')">RSI</button>
            <button class="btn" id="btn-kdj" onclick="toggleSubIndicator('KDJ')">KDJ</button>
          </div>
        </div>
      </div>

      <div id="error-tip" class="error-tip">图表核心库加载失败，请检查网络连接。</div>
      <!-- 图表挂载点 -->
      <div id="chart-container"></div>
    </div>

  </div>

  <script>
    window.addEventListener('load', () => {
      // 检查组件库是否正常加载
      if (typeof klinecharts === 'undefined') {
        document.getElementById('error-tip').style.display = 'block';
        return;
      }

      let chart = null;
      let currentMainIndicator = 'BOLL';
      const subPanes = {};

      // 模拟生成行业 OHLCV 数据（真实项目中可在此处通过 fetch 替换为后端接口数据）
      function generateMockData(basePrice, volatility) {
        const data = [];
        let baseTime = new Date('2025-01-01').getTime();
        let currentPrice = basePrice;

        for (let i = 0; i < 250; i++) {
          const changeRatio = (Math.random() - 0.48) * volatility;
          const open = currentPrice;
          const close = open * (1 + changeRatio);
          const high = Math.max(open, close) * (1 + Math.random() * 0.015);
          const low = Math.min(open, close) * (1 - Math.random() * 0.015);
          const volume = Math.floor(Math.random() * 900000) + 100000;

          data.push({
            timestamp: baseTime + i * 24 * 60 * 60 * 1000,
            open: Number(open.toFixed(2)),
            high: Number(high.toFixed(2)),
            low: Number(low.toFixed(2)),
            close: Number(close.toFixed(2)),
            volume: volume
          });
          currentPrice = close;
        }
        return data;
      }

      // 1. 初始化图表（交易所暗色交易风格配置）
      function initChart() {
        chart = klinecharts.init('chart-container', {
          styles: {
            grid: {
              horizontal: { color: '#2a2e39', style: 'dashed' },
              vertical: { color: '#2a2e39', style: 'dashed' }
            },
            candle: {
              type: 'candle_solid',
              bar: {
                upColor: '#089981',        // 涨（绿）
                downColor: '#f23645',      // 跌（红）
                noChangeColor: '#888888',
                upBorderColor: '#089981',
                downBorderColor: '#f23645',
                upWickColor: '#089981',
                downWickColor: '#f23645'
              }
            },
            technicalIndicator: {
              bar: {
                upColor: 'rgba(8, 153, 129, 0.6)',
                downColor: 'rgba(242, 54, 69, 0.6)'
              }
            }
          }
        });

        // 默认加载第一个板块（半导体）
        loadIndustryData('880491', '半导体板块', 1500, 0.04);

        // 默认初始指标配置
        chart.createIndicator('BOLL', false, { id: 'candle_pane' });
        subPanes['VOL'] = chart.createIndicator('VOL');
        subPanes['MACD'] = chart.createIndicator('MACD');
      }

      // 2. 加载特定行业板块的数据
      window.loadIndustryData = function(code, name, basePrice, volatility) {
        document.getElementById('current-stock-title').innerText = `${name} (${code})`;
        const chartData = generateMockData(Number(basePrice), Number(volatility));
        chart.applyNewData(chartData);
      }

      // 3. 切换主图指标（BOLL / MA / 无）
      window.switchMainIndicator = function(name) {
        if (currentMainIndicator !== 'NONE') {
          chart.overrideIndicator({ name: currentMainIndicator, visible: false }, 'candle_pane');
        }

        document.getElementById('btn-boll').classList.remove('active');
        document.getElementById('btn-ma').classList.remove('active');
        document.getElementById('btn-none').classList.remove('active');

        currentMainIndicator = name;

        if (name === 'BOLL') {
          chart.createIndicator('BOLL', false, { id: 'candle_pane' });
          document.getElementById('btn-boll').classList.add('active');
        } else if (name === 'MA') {
          chart.createIndicator('MA', false, { id: 'candle_pane' });
          document.getElementById('btn-ma').classList.add('active');
        } else {
          document.getElementById('btn-none').classList.add('active');
        }
      }

      // 4. 切换副图指标显示状态（VOL / MACD / RSI / KDJ）
      window.toggleSubIndicator = function(name) {
        const btn = document.getElementById(`btn-${name.toLowerCase()}`);
        if (subPanes[name]) {
          chart.removeIndicator(subPanes[name]);
          delete subPanes[name];
          btn.classList.remove('active');
        } else {
          subPanes[name] = chart.createIndicator(name);
          btn.classList.add('active');
        }
      }

      // 5. 绑定左侧行业菜单点击切换事件
      document.querySelectorAll('.industry-item').forEach(item => {
        item.addEventListener('click', function() {
          document.querySelectorAll('.industry-item').forEach(el => el.classList.remove('active'));
          this.classList.add('active');

          const code = this.getAttribute('data-code');
          const name = this.getAttribute('data-name');
          const base = this.getAttribute('data-base');
          const vol = this.getAttribute('data-vol');

          loadIndustryData(code, name, base, vol);
        });
      });

      // 窗口大小调整自适应
      window.addEventListener('resize', () => {
        if (chart) chart.resize();
      });

      // 执行初始化
      initChart();
    });
  </script>
</body>
</html>
